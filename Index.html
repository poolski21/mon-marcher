<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Supermarché en Ligne</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mon Supermarché</h1>
    <input type="text" id="search" placeholder="Rechercher un produit...">
    <button id="cart-btn">Panier (<span id="cart-count">0</span>)</button>
  </header>

  <nav id="categories">
    <button data-category="all">Tous</button>
    <button data-category="fruits">Fruits</button>
    <button data-category="legumes">Légumes</button>
    <button data-category="produits-laitiers">Produits laitiers</button>
    <button data-category="boissons">Boissons</button>
  </nav>

  <main id="product-list">
    <!-- Les produits seront injectés ici -->
  </main>

  <div id="cart-modal" class="modal hidden">
    <h2>Votre Panier</h2>
    <ul id="cart-items"></ul>
    <p>Total : <span id="cart-total">0 €</span></p>
    <button id="checkout-btn">Commander</button>
    <button id="close-cart">Fermer</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
